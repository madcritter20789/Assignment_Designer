<!doctype html><html><head><meta charset="UTF-8"><title>Beyblade Arena browser checks</title></head><body style="margin:0"><pre id="report">Running browser checks…</pre><iframe id="app" style="border:0;width:100%;height:900px"></iframe><script type="module">
const frame=document.querySelector('#app'),report=document.querySelector('#report'),params=new URLSearchParams(location.search);
if(params.has('width'))frame.style.width=params.get('width')+'px';
let html=await(await fetch('/')).text();html=html.replace('<head>','<head><base href="/">');
html=html.replace(/<script type="module" src="\/src\/main.js[^\"]*"><\/script>/,`<script type="module">${params.has('reduced')?`const original=window.matchMedia;window.matchMedia=q=>q.includes('prefers-reduced-motion')?{matches:true,addEventListener(){},removeEventListener(){}}:original(q);`:''}${params.has('fallback')?`Image.prototype.decode=()=>Promise.reject(new Error('QA texture failure'));`:''}await import('/src/main.js');</scr`+'ipt>');frame.srcdoc=html;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),checks=[];
if(!params.has('visual'))try{
await wait(2000);const w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id);
const check=(name,value)=>{if(!value)throw Error(name);checks.push(name)};
const until=async(condition)=>{for(let i=0;i<80;i++){if(condition())return;await wait(100)}throw Error('Timed out waiting for UI state')};
const key=(type,code)=>$('stage').dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true}));
const pull=async()=>{$('stage').focus();key('keydown','Space');await wait(400);key('keyup','Space');await wait(300)};
await until(()=>$('overlay').hidden);check('initialized and muted',$('sound').getAttribute('aria-pressed')==='false');
check('mandatory shaders active',!$('stage').dataset.shaderFallback&&$('paper-background').querySelector('canvas')&&$('paper-surface').querySelector('canvas'));
check('Paper rim or fallback',params.has('fallback')?$('paper-rim').dataset.fallback==='true':!!$('paper-rim').querySelector('canvas'));
check('six visual previews, no selection dropdowns',d.querySelectorAll('.design-card svg.top-preview').length===6&&d.querySelectorAll('select').length===0);
check('mobile begins with arena',w.innerWidth>700||$('stage').getBoundingClientRect().top<230);
$('round-setup').open=true;await wait(100);
check('preview motion preference',params.has('reduced')?$('preview-motion').disabled:d.body.dataset.previewMotion==='running');
if(!params.has('reduced')){$('preview-motion').click();await wait(100);check('preview pause control',d.body.dataset.previewMotion==='paused');$('preview-motion').click()}
for(const group of ['design-a','design-b'])for(const value of ['strike','guard','glide'])$(group).querySelector(`[data-design=${value}]`).click();await wait(200);
check('design cards select and announce',$('design-a').querySelector('[data-design=glide]').getAttribute('aria-pressed')==='true'&&$('status').textContent.includes('Glide'));
$('stage').focus();key('keydown','Space');await wait(100);key('keydown','Escape');key('keyup','Space');await wait(200);check('Escape cancels',$('stage').dataset.phase==='setupA');
key('keydown','Space');await wait(100);w.dispatchEvent(new w.Event('blur'));key('keyup','Space');await wait(200);check('blur cancels',$('stage').dataset.phase==='setupA');
d.querySelector('.ripcord-option').open=true;$('ripcord').setPointerCapture=()=>{};
const pointer=(type,x)=>$('ripcord').dispatchEvent(new w.PointerEvent(type,{pointerId:7,pointerType:'touch',button:0,clientX:x,bubbles:true}));
pointer('pointerdown',10);pointer('pointermove',130);pointer('pointercancel',130);pointer('pointerup',130);await wait(200);check('touch cancellation never launches',$('stage').dataset.phase==='setupA');
pointer('pointerdown',10);pointer('pointermove',400);pointer('pointerup',400);await wait(200);check('outside-track release commits',$('stage').dataset.phase==='countdown');$('reset').click();
$('aim').value='45';$('aim').dispatchEvent(new w.Event('input'));await until(()=>$('aim-value').textContent==='45°');check('aim slider updates',true);
const hold=$('hold-launch');hold.setPointerCapture=()=>{};const holdEvent=type=>hold.dispatchEvent(new w.PointerEvent(type,{pointerId:8,pointerType:'touch',button:0,bubbles:true}));
holdEvent('pointerdown');await wait(130);holdEvent('pointercancel');holdEvent('pointerup');await wait(200);check('hold cancellation',$('stage').dataset.phase==='setupA');
holdEvent('pointerdown');await wait(400);check('power feedback updates',Number.parseInt($('pull-value').textContent)>8);holdEvent('pointerup');await wait(200);check('hold launches',$('stage').dataset.phase==='countdown');$('reset').click();
$('mode-both').click();await pull();check('coral saved before teal',$('stage').dataset.phase==='setupB'&&$('spin-a').textContent==='STAGED'&&$('mode-hint').textContent.includes('% power'));
check('staged coral locked, teal editable',[...$('design-a').querySelectorAll('button')].every(e=>e.disabled)&&[...$('design-b').querySelectorAll('button')].every(e=>!e.disabled));
check('teal instructions explain simultaneous launch',$('instructions').textContent.includes('start both'));
await pull();await until(()=>$('stage').dataset.phase==='battling');check('both launch simultaneously',$('mode-both').disabled&&$('round-label').textContent.includes('s left'));
check('inactive power fields hidden',$('launch-setup').hidden&&d.body.dataset.previewMotion==='paused');
$('pause').click();await wait(100);const before=$('meter-a').getAttribute('aria-valuenow');await wait(200);check('pause freezes spin',$('meter-a').getAttribute('aria-valuenow')===before);
check('pause copy and hidden launch fields',$('dock-label').textContent==='ON HOLD'&&$('launch-setup').hidden&&!$('mode-hint').textContent.includes('CPU'));
$('theme-retro').click();$('top').click();await wait(200);check('theme and camera preserve round',d.body.dataset.theme==='retro'&&$('pause').getAttribute('aria-pressed')==='true'&&$('meter-a').getAttribute('aria-valuenow')===before);
check('opaque foreground ripcord',w.getComputedStyle($('ripcord')).opacity==='1'&&w.getComputedStyle($('ripcord')).zIndex==='2');
$('pause').click();
const intervals=[];await new Promise(resolve=>{let previous;function tick(t){if(previous)intervals.push(t-previous);previous=t;if(intervals.length<90)w.requestAnimationFrame(tick);else resolve()}w.requestAnimationFrame(tick)});intervals.sort((a,b)=>a-b);checks.push(`RAF median ${intervals[45].toFixed(2)} ms; p95 ${intervals[85].toFixed(2)} ms (90 intervals)`);
$('reset').click();await wait(200);check('reset resumes, clears, retains designs',$('spin-a').textContent==='READY'&&$('hit-label').textContent==='0 clashes'&&$('pause').getAttribute('aria-pressed')==='false'&&$('design-a').querySelector('[data-design=glide]').getAttribute('aria-pressed')==='true');
check('no horizontal overflow',d.documentElement.scrollWidth<=w.innerWidth);
check('44px visible controls',[...d.querySelectorAll('button,summary,input')].filter(e=>e.getBoundingClientRect().height>0).every(e=>e.getBoundingClientRect().height>=44));
for(let i=0;i<10;i++)$('reset').click();check('bounded GPU contexts after resets',d.querySelectorAll('canvas').length===(params.has('fallback')?3:4));
Object.defineProperty(d,'hidden',{configurable:true,value:true});d.dispatchEvent(new w.Event('visibilitychange'));await wait(100);check('hidden tab pauses game and previews',$('pause').getAttribute('aria-pressed')==='true'&&d.body.dataset.previewMotion==='paused');
$('scene').dispatchEvent(new w.Event('webglcontextlost',{cancelable:true}));await wait(100);check('context loss offers Retry',$('overlay-action').dataset.action==='retry');
report.textContent='PASS\n'+checks.join('\n');
}catch(error){report.textContent='FAIL '+error.message+'\n'+checks.join('\n')}
</script></body></html>
