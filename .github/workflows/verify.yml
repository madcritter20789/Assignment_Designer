name: Verify Beyblade Arena
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyblade-battle
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: beyblade-battle/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
